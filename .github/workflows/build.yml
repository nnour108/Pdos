name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android-project.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -q android-project.zip -d proj
      - run: cd proj && gradle assembleRelease --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/release/app-release.apk --title "HABIT MENTALITY ${{ github.run_number }}" --notes "APK"

h+=`<h2>${ed==='new'?'عادة جديدة':'تعديل العادة'}</h2><div class="card">${F.map(([k,l])=>`<label>${l}</label><input id="f_${k}" value="${e(b[k])}">`).join('')}<div class="g2"><div><label>الأولوية</label><select id="f_prio">${PR.map((n,i)=>`<option value="${i}" ${b.prio===i?'selected':''}>${n}</option>`).join('')}</select></div><div><label>تعتمد على</label><select id="f_dep"><option value="">لا شيء</option>${S.habits.filter(x=>x.id!==ed).map(x=>`<option value="${x.id}" ${b.dep===x.id?'selected':''}>${e(x.name)}</option>`).join('')}</select></div><div><label>الاحتكاك 1-10</label><input id="f_fric" type="number" min="1" max="10" value="${b.fric}"></div><div><label>دعم البيئة 1-10</label><input id="f_env" type="number" min="1" max="10" value="${b.env}"></div></div><div class="row" style="margin-top:8px"><button class="pri" onclick="sv()">حفظ</button><button onclick="ed=null;render()">إلغاء</button></div></div>`}
else h+=`<button class="pri" onclick="ed='new';render()">+ إضافة عادة</button>`;
h+=`<h2>كل العادات (${S.habits.length})</h2>`+H().map(b=>`<div class="card p${b.prio}"><div class="row sp"><h3>${e(b.name)}</h3><span class="tag">${PR[b.prio]} · ${hp(b)} نقطة</span></div><div class="mut">${e(b.why)}</div><div class="mut">احتكاك ${b.fric}/10 · بيئة ${b.env}/10${b.dep&&hb(b.dep)?` · تعتمد على ${e(hb(b.dep).name)}`:''}</div><div class="row" style="margin-top:6px"><button onclick="ed='${b.id}';render();scrollTo(0,0)">تعديل</button><button class="dn" onclick="if(confirm('حذف العادة؟')){S.habits=S.habits.filter(x=>x.id!=='${b.id}');save();render()}">حذف</button></div></div>`).join('');
h+=`<h2>نسخة احتياطية</h2><div class="card"><div class="row"><button onclick="bk=JSON.stringify(S);render()">تصدير</button><button onclick="im()">استعادة</button></div><textarea id="bk" style="margin-top:6px" placeholder="الصق النسخة هنا للاستعادة">${e(bk)}</textarea><div class="mut">البيانات محفوظة في متصفحك فقط.</div></div>`;
return h}
function sv(){const b=ed==='new'?{id:'h'+Date.now(),created:T}:hb(ed);F.forEach(([k])=>b[k]=$('#f_'+k).value.trim());if(!b.name)return alert('اكتب اسم العادة');b.prio=+$('#f_prio').value;b.dep=$('#f_dep').value;b.fric=+$('#f_fric').value||5;b.env=+$('#f_env').value||5;if(ed==='new')S.habits.push(b);save();ed=null;render()}
function im(){try{const d=JSON.parse($('#bk').value);if(!d.habits)throw 0;S=d;save();bk='';render()}catch(x){alert('النسخة غير صالحة')}}
function expRes(x){const b=hb(x.h);if(!b)return'';const f=a=>{const p=hs(b,rng(a,7).filter(d=>d<=TE()));return p?Math.round(p.rate*100):null};const A=f(x.start),B=f(addD(x.start,-7));return `قبل: ${B==null?'—':B+'%'} ← أثناء: ${A==null?'—':A+'%'}`}
function vExps(){
let h=`<h2>التجارب</h2><div class="mut">خطط، نفّذ، قِس، حلّل، عدّل، أعد الاختبار.</div><div class="card"><label>التجربة</label><input id="x_t" placeholder="مثال: نقل التدريب إلى 5 مساءً"><label>العادة</label><select id="x_h">${S.habits.map(b=>`<option value="${b.id}">${e(b.name)}</option>`).join('')}</select><label>الفرضية</label><input id="x_y" placeholder="أتوقع أن الالتزام سيرتفع لأن..."><button class="pri" style="margin-top:8px" onclick="nx()">ابدأ لمدة 7 أيام</button></div>`;
if(!S.exps.length)h+=`<div class="card mut">لا توجد تجارب بعد. ستقترح لك صفحة «الأسبوع» تجارب بناءً على بياناتك.</div>`;
return h+S.exps.map((x,i)=>`<div class="card"><div class="row sp"><h3>${e(x.t)}</h3><span class="tag">${x.done?'منتهية':'جارية'}</span></div><div class="mut">${e((hb(x.h)||{}).name)} · بدأت ${fd(x.start)}</div><div class="mut">${e(x.hy)}</div><div>${expRes(x)}</div><label>الاستنتاج</label><textarea onchange="S.exps[${i}].c=this.value;save()">${e(x.c)}</textarea><div class="row" style="margin-top:6px"><button onclick="S.exps[${i}].done=${x.done?0:1};save();render()">${x.done?'إعادة فتح':'إنهاء'}</button><button class="dn" onclick="S.exps.splice(${i},1);save();render()">حذف</button></div></div>`).join('')}
function nx(){const t=$('#x_t').value.trim();if(!t||!S.habits.length)return;S.exps.unshift({id:'x'+Date.now(),t,h:$('#x_h').value,start:T,hy:$('#x_y').value,done:0});save();render()}
function render(){$('#v').innerHTML={today:vToday,week:vWeek,habits:vHabits,exps:vExps}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
</script>

<script>
RS.push('أخرى');SUG['أخرى']='اكتب السبب الحقيقي لنتعلّم منه';F.push(['pts','النقاط (أهمية العادة، مثلًا 10)']);S.chat=S.chat||[];
const QT=[['رحلة الألف ميل تبدأ بخطوة واحدة.','لاو تزو'],['لا يهم كم تمشي ببطء، المهم ألا تتوقف.','كونفوشيوس'],['كرهت كل دقيقة من التدريب، لكنني قلت: لا تستسلم، تألّم الآن وعِش بقية حياتك بطلًا.','محمد علي كلاي'],['العبقرية واحد بالمئة إلهام وتسعة وتسعون بالمئة عرق.','توماس إديسون'],['لا توجد رياح مواتية لمن لا يعرف إلى أين يتجه.','سينيكا'],['فشلت مرارًا في حياتي، ولهذا نجحت.','مايكل جوردان'],['النجاح ليس صدفة، إنه عمل شاق ومثابرة وتعلّم وتضحية.','بيليه'],['الانضباط هو الجسر بين الأهداف والإنجاز.','جيم رون'],['أحبّ الأعمال إلى الله أدومها وإن قلّ.','النبي محمد ﷺ'],['نحن ما نفعله باستمرار، فالتميّز ليس فعلًا بل عادة.','ول ديورانت'],['لا أخشى من تدرّب على ألف ركلة مرة، بل من تدرّب على ركلة واحدة ألف مرة.','بروس لي (تُنسب إليه)'],['الموهبة تكسب المباريات، أما العمل الجماعي والذكاء فيكسبان البطولات.','مايكل جوردان']];
const FA=[0,.5,1,1.25],hp=h=>+h.pts>0?+h.pts:10;
function pts(ds){let a=0,b=0;S.habits.forEach(h=>ds.forEach(d=>{if(st(h,d)===null)return;b+=hp(h);const l=lg(d,h.id);if(l&&l.l)a+=hp(h)*FA[l.l]}));ds.forEach(d=>((S.days[d]||{}).tasks||[]).forEach(t=>{b+=+t.p||0;if(t.d)a+=+t.p||0}));return[Math.round(a),Math.round(b)]}
const tl=()=>{const z=S.days[date]=S.days[date]||{};return z.tasks=z.tasks||[]};
function ta(){const t=$('#t_n').value.trim();if(!t)return;tl().push({t,p:+$('#t_p').value||0,d:0});save();render()}
const tg=i=>{tl()[i].d^=1;snd(tl()[i].d?1:0);save();render()},td=i=>{tl().splice(i,1);save();render()};
function tasksHTML(){const ts=(S.days[date]||{}).tasks||[];return `<div class="card"><div class="row sp"><h3>المهام</h3><span class="tag">${ts.filter(x=>x.d).length}/${ts.length}</span></div>`+ts.map((x,i)=>`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><input type="checkbox" style="width:22px;height:22px;flex:none" ${x.d?'checked':''} onchange="tg(${i})"><span style="flex:1;${x.d?'text-decoration:line-through;opacity:.6':''}">${e(x.t)}</span><span class="tag">${x.p} نقطة</span><button class="dn" onclick="dtask(${i})">×</button></div>`).join('')+`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="t_n" placeholder="مهمة جديدة"><input id="t_p" type="number" value="10" style="width:78px" aria-label="النقاط"><button class="pri" onclick="ta()">إضافة</button></div></div>`}
const oldToday=vToday;
function vTodayN(){const q=QT[Math.floor(new Date(date+'T12:00')/864e5)%QT.length],pp=pts([date]);
const hero=`<div class="hero"><div style="font-size:.85rem;opacity:.85">${e(S.identity)||'حدّد هويتك من تبويب العادات'}</div><div style="font-size:1.08rem;font-weight:700;line-height:1.7;margin:6px 0">«${q[0]}»</div><div style="opacity:.85;font-size:.85rem">— ${q[1]}</div><div class="row sp" style="margin-top:10px"><b>${pp[0]} / ${pp[1]} نقطة اليوم</b></div><div class="bar"><i style="width:${pp[1]?Math.min(100,100*pp[0]/pp[1]):0}%"></i></div></div>`;
return hero+oldToday().replace(/<div class="card"><h3>أهم 3 مهام<\/h3>[\s\S]*?<\/div>(?=<h2>العادات)/,tasksHTML()).replace('<h2>العادات</h2>','<div class="row sp"><h2>العادات</h2><button onclick="tab=\'habits\';ed=\'new\';render()">+ عادة</button></div>')+`<div class="card sec-ai"><button class="pri" onclick="aiDay()">حلّل يومي بالذكاء الاصطناعي</button><div id="aiD" class="ai"></div></div>`}
let per='week',anc=T;const PL={week:'أسبوعي',month:'شهري',quarter:'ربع سنوي',year:'سنوي'};
function pr(){const d=new Date(anc+'T12:00'),y=d.getFullYear(),m=d.getMonth(),MN=x=>new Date(y,x,1).toLocaleDateString((LOC[LG()]||'ar-EG'),{month:'long'});
if(per==='week'){const s=wStart(anc),ds=rng(s,7);return{ds,k:'w'+s,l:fd(s)+' ← '+fd(ds[6]),bk:ds.map(x=>[DAYS[wIdx(x)],[x]])}}
let a,b,l;if(per==='month'){a=new Date(y,m,1);b=new Date(y,m+1,0);l=MN(m)+' '+y}else if(per==='quarter'){const q=Math.floor(m/3);a=new Date(y,q*3,1);b=new Date(y,q*3+3,0);l='الربع '+(q+1)+' · '+y}else{a=new Date(y,0,1);b=new Date(y,11,31);l=''+y}
const s=iso(a),ds=rng(s,Math.round((b-a)/864e5)+1);let bk=[];
if(per==='month')for(let i=0;i<ds.length;i+=7)bk.push(['أسبوع '+(i/7+1),ds.slice(i,i+7)]);
else{const g={};ds.forEach(x=>(g[x.slice(5,7)]=g[x.slice(5,7)]||[]).push(x));bk=Object.entries(g).map(([k,v])=>[MN(+k-1),v])}
return{ds,k:per+s,l,bk}}
function mv(n){if(per==='week')anc=addD(anc,7*n);else{const d=new Date(anc+'T12:00');d.setDate(1);d.setMonth(d.getMonth()+n*{month:1,quarter:3,year:12}[per]);anc=iso(d)}render()}
function bp(ds){let a=0,b=0;S.habits.forEach(h=>ds.forEach(d=>{const s=st(h,d);if(s!==null){b++;a+=s}}));return b?Math.round(100*a/b):null}
function vAn(){const P=pr(),hh=H();
let h=`<div class="seg">${Object.entries(PL).map(([k,v])=>`<button class="${per===k?'on':''}" onclick="per='${k}';anc=T;render()">${v}</button>`).join('')}</div><div class="row sp" style="margin-top:8px"><button onclick="mv(-1)">السابق</button><h3>${P.l}</h3><button onclick="mv(1)">التالي</button></div>`;
const r=hh.map(b=>({b,s:hs(b,P.ds)})).filter(x=>x.s);
if(!r.length)return h+`<div class="card mut" style="margin-top:10px">لا توجد بيانات لهذه الفترة بعد.</div>`;
const m=f=>r.reduce((s,x)=>s+f(x.s),0)/r.length,p=x=>Math.round(x)+'%',pp=pts(P.ds);
const ws=r.reduce((s,x)=>s+PW[x.b.prio],0),idn=r.reduce((s,x)=>s+PW[x.b.prio]*x.s.rate,0)/ws;
const best=r.reduce((a,b)=>b.s.rate>a.s.rate?b:a),worst=r.reduce((a,b)=>b.s.rate<a.s.rate?b:a);
h+=`<div class="g2" style="margin-top:10px">${tile('النقاط',pp[0]+' / '+pp[1])}${tile('إجمالي الإنجاز',p(m(x=>x.rate)*100))}${tile('الاتساق',p(m(x=>x.cons)*100))}${tile('جودة التنفيذ',m(x=>x.q).toFixed(1)+'/10')}${tile('متوسط الطاقة',m(x=>x.en).toFixed(1)+'/10')}${tile('العودة بعد التعثر',p(m(x=>x.r)*100))}${tile('درجة الهوية',(window.HM&&HM.idAll()!=null)?HM.idAll()+'/100':p(idn*100))}${tile('أطول سلسلة',Math.max(...r.map(x=>streak(x.b)))+' يوم')}${tile('أقوى عادة',e(best.b.name)+' '+p(best.s.rate*100))}${tile('أضعف عادة',e(worst.b.name)+' '+p(worst.s.rate*100))}</div>`;
h+=`<div class="card"><h3>الالتزام عبر الفترة (%)</h3><div class="chart">${P.bk.map(([l,ds])=>{const v=bp(ds);return `<div class="bc"><span>${v==null?'—':v}</span><i style="height:${v||0}%"></i><small>${l}</small></div>`}).join('')}</div></div>`;
h+=`<h2>درجة كل عادة (0–100)</h2>`+r.map(x=>`<div class="card p${x.b.prio}"><div class="row sp"><h3>${e(x.b.name)}</h3><b>${x.s.score}</b></div><div class="bar"><i style="width:${x.s.score}%"></i></div><div class="mut">نُفذت ${x.s.done}/${x.s.n} · سلسلة ${streak(x.b)} · عودة ${Math.round(x.s.r*100)}%</div></div>`).join('');
h+=goalsHTML(P)+`<h2>التشخيص السريع</h2>`+insHTML(insights());
h+=`<div class="card"><button class="pri" onclick="aiPer()">حلّل ${PL[per]} بالذكاء الاصطناعي مع التوصيات</button><div id="aiP" class="ai"></div></div><h2>المراجعة</h2><div class="card">${rev(P.k,['ماذا حدث؟','ماذا نجح؟','ماذا فشل ولماذا؟','ما النمط؟','ماذا نغير؟','ماذا نختبر؟'])}</div>`;
return h}
const md=t=>e(t).replace(/^#+ (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[-•*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,x=>'<ul>'+x.replace(/\n/g,'')+'</ul>').replace(/(<\/h3>|<\/ul>)\n/g,'$1').replace(/\n/g,'<br>');
function ctx(ds){ds=ds.filter(d=>d<=TE());const rs={};S.habits.forEach(h=>ds.forEach(d=>{const l=lg(d,h.id);if(l&&l.l===0&&l.r){const k=h.name+': '+(l.r==='أخرى'?l.ro||l.r:l.r);rs[k]=(rs[k]||0)+1}}));
return JSON.stringify({اليوم:T,الفترة:[ds[0],ds[ds.length-1]],الهوية:S.identity,النقاط:pts(ds),أسباب_الفشل:rs,أسباب_النجاح:(()=>{const o={};S.habits.forEach(h=>ds.forEach(d=>{const l=lg(d,h.id);if(l&&l.l>0&&l.sr){const k=h.name+': '+(l.sr==='أخرى'?l.sro||l.sr:l.sr);o[k]=(o[k]||0)+1}}));return o})(),عادات:S.habits.map(h=>{const s=hs(h,ds);return{اسم:h.name,أولوية:PR[h.prio],نقاط:hp(h),لماذا:h.why,نوع:h.kind,تكرار:JSON.stringify(h.freq),أهداف:[h.gw,h.gm,h.gq,h.gy].join("/"),وصف:h.desc,محفز:[h.when,h.where,h.what].join('/'),أدنى:h.min,طبيعي:h.std,مثالي:h.max,احتكاك:h.fric,بيئة:h.env,اعتماد:(hb(h.dep)||{}).name,نتيجة:s&&{التزام:Math.round(s.rate*100),درجة:s.score,نُفذ:s.done,من:s.n,جودة:+s.q.toFixed(1),سلسلة:streak(h)}}}),تفاصيل:ds.slice(-31).map(d=>{const z=S.days[d]||{};return{d,نوم:z.sleep,طاقة:z.energy,تركيز:z.focus,مزاج:z.mood,تقييم_اليوم:z.rate,مهام:(z.tasks||[]).map(t=>t.t+(t.d?'✓':'✗')+t.p),عادات:S.habits.map(h=>h.name+':'+(lg(d,h.id)?lg(d,h.id).l:'-')).join(' ')}})})}
const SYS='أنت أكبر خبير في علم العادات وتصميم السلوك (Atomic Habits، نموذج فوج B=MAP، نوايا التنفيذ، نظرية تقرير المصير). حلّل بيانات المستخدم بدقة وبالعربية المصرية المبسطة والمنظمة. لا تخترع بيانات؛ لو البيانات قليلة قل ذلك صراحة. التنسيق: عناوين ## ثم نقاط قصيرة تبدأ بـ - . الأقسام بالترتيب: ## الخلاصة ## نقاط القوة ## المشاكل وأسبابها ## ماذا أضيف ## ماذا أعدّل ## ماذا أخفّف أو أحذف ## خطة الفترة القادمة (خطوات محددة) ## تجربة مقترحة. كن محددًا وعمليًا واذكر أسماء العادات واربط التوصيات بالنقاط والأولويات.';
const SYSC='أنت مدرب شخصي أعلى خبير في العادات والسلوك والانضباط. ردّ بالعربية المصرية المبسطة، مباشرًا وعمليًا ومختصرًا، ومبنيًا على بيانات المستخدم المرفقة. لا تخترع بيانات. اقترح خطوات صغيرة قابلة للتنفيذ، وسؤالًا واحدًا فقط عند الحاجة.';
async function ai(sys,u,box){box.innerHTML='<div class="mut">جارٍ التحليل…</div>';try{const sm=await claude.use('sample');if(!sm){const t0=LC(u);box.innerHTML=md(t0);return t0}
const r=await sm([{role:'user',content:sys+'\n\n'+u+(LG()!=='ar'?'\n\nاكتب الرد كاملًا باللغة: '+LN[LG()]:'')}],{onText:x=>{box.innerHTML=md(x.text)},cache:false});box.innerHTML=md(r.text);return r.text}catch(x){const t1=LC(u);box.innerHTML=md(t1);return t1}}
const aiDay=()=>ai(SYS,'نوع التحليل: يومي ليوم '+date+' مع مقارنته بآخر 7 أيام. البيانات: '+ctx(rng(addD(date,-6),7)),$('#aiD'));

/* ---- الإنجاز الشامل ---- */
const FLEX=f=>f&&(f.t==='week'||f.t==='month');
function oaiH(h0,ds){const V=ver(h0,ds[ds.length-1]||T),f=V.freq||{};
if(FLEX(f)){const s=hs(h0,ds);if(!s)return null;const q=s.q?s.q/10:.7;return{h:V,rate:s.rate,q,cons:s.cons||s.rate,o:Math.round(100*(.6*s.rate+.4*q)),w:hp(V)}}
let n=0,dn=0,lf=0,qs=[];ds.forEach(d=>{if(d>TE())return;const s=st(h0,d);if(s===null)return;n++;if(s===1){dn++;const l=lg(d,h0.id)||{};lf+=Math.min(1,(l.l>0?l.l:1)/2);if(l.q!=null&&!l.qd&&+l.q>0)qs.push(+l.q)}});
if(!n)return null;const rate=dn/n,q=qs.length?qs.reduce((a,b)=>a+b,0)/qs.length/10:(dn?lf/dn:0),s=hs(h0,ds);return{h:V,rate,q,cons:s&&s.cons!=null?s.cons:rate,o:Math.round(100*(.6*rate+.4*q)),w:hp(V)}}
function oaiAll(ds){ds=ds.filter(d=>d<=TE());const r=S.habits.filter(h=>!h.ar).map(h=>oaiH(h,ds)).filter(Boolean);if(!r.length)return null;const W=r.reduce((a,x)=>a+x.w,0),f=k=>r.reduce((a,x)=>a+x.w*x[k],0)/W;return{o:Math.round(f('o')),rate:f('rate'),q:f('q'),cons:f('cons'),r}}
const grade=o=>o>=90?t2('استثنائي 🏆','Exceptional 🏆'):o>=80?t2('ممتاز 🌟','Excellent 🌟'):o>=65?t2('جيد جدًا 👏','Very good 👏'):o>=50?t2('جيد 👍','Good 👍'):o>=35?t2('يحتاج تحسين 💪','Needs work 💪'):t2('ابدأ من الأساسيات 🌱','Start with basics 🌱');
/* ---- محلل الأداء ---- */
const pear=(x,y)=>{const n=x.length,mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n;let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):0};
function corrs(){const ds=rng(addD(T,-59),60).filter(d=>d<=TE()),o=[];[['النوم',z=>+z.sleep],['الطاقة',z=>+z.energy],['التركيز',z=>+z.focus],['المزاج',z=>+z.mood]].forEach(([n,f])=>{const X=[],Y=[];ds.forEach(d=>{const z=S.days[d],v=z?f(z):NaN,p=bp([d]);if(v>0&&p!=null){X.push(v);Y.push(p)}});if(X.length>=8)o.push({n,r:pear(X,Y),k:X.length})});
const X=[],Y=[];ds.forEach(d=>{const m=(S.focus||{})[d],p=bp([d]);if(m>0&&p!=null){X.push(m);Y.push(p)}});if(X.length>=6)o.push({n:'وقت التركيز (بومودورو)',r:pear(X,Y),k:X.length});return o.filter(x=>Math.abs(x.r)>=.3).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r)).slice(0,3)}
function keystone(){const hh=S.habits.filter(h=>!h.ar);if(hh.length<3)return null;const ds=rng(addD(T,-59),60).filter(d=>d<T);let best=null;hh.forEach(a=>{const on=[],off=[];ds.forEach(d=>{const sa=st(a,d);if(sa===null)return;const o=hh.filter(b=>b!==a).map(b=>st(b,d)).filter(x=>x!==null);if(!o.length)return;(sa?on:off).push(o.reduce((x,y)=>x+y,0)/o.length)});if(on.length>=6&&off.length>=6){const m=x=>x.reduce((p,q)=>p+q,0)/x.length,df=m(on)-m(off);if(!best||df>best.df)best={h:ver(a,T),df,on:m(on),off:m(off)}}});return best&&best.df>=.15?best:null}
function recov(){const L=[];S.habits.filter(h=>!h.ar).forEach(h=>{let m=0;rng(addD(T,-89),90).forEach(d=>{if(d>TE())return;const s=st(h,d);if(s===0)m++;else if(s===1&&m>0){L.push(m);m=0}})});return L.length?{avg:L.reduce((a,b)=>a+b,0)/L.length,n:L.length}:null}
function trend(){const pts_=[];for(let i=7;i>=0;i--){const w=rng(addD(wStart(T),-7*i),7).filter(d=>d<=TE()),r=w.length?oaiAll(w):null;pts_.push(r?r.o:null)}const P=pts_.map((y,x)=>[x,y]).filter(p=>p[1]!=null);let sl=0,nx=null;if(P.length>=3){const n=P.length,mx=P.reduce((a,p)=>a+p[0],0)/n,my=P.reduce((a,p)=>a+p[1],0)/n;let a=0,b=0;P.forEach(p=>{a+=(p[0]-mx)*(p[1]-my);b+=(p[0]-mx)**2});sl=b?a/b:0;nx=Math.max(0,Math.min(100,Math.round(P[P.length-1][1]+sl)))}return{pts:pts_,sl,nx}}
function recs(P){const ds=P.ds.filter(d=>d<=TE()),a=S.habits.filter(h=>!h.ar).map(h=>oaiH(h,ds)).filter(Boolean),o=[],ks=keystone(),cu=oaiAll(ds);
a.forEach(x=>{if(x.rate<.5)o.push({k:'adj',id:x.h.id,m:`«${x.h.name}»: الالتزام ${Math.round(x.rate*100)}% — خفّض الطبيعي أو اربطها بمحفز أوضح.`});else if(x.rate>=.85&&x.q<.6)o.push({k:'adj',id:x.h.id,m:`«${x.h.name}»: تنفّذها بانتظام لكن الجودة ${Math.round(x.q*100)}% — ركّز على الجودة أو ارفع التحدي.`})});
a.filter(x=>x.rate<.3&&hp(x.h)<=5).slice(0,1).forEach(x=>o.push({k:'drop',id:x.h.id,m:`«${x.h.name}»: التزام ${Math.round(x.rate*100)}% ونقاط قليلة — فكّر في أرشفتها مؤقتًا لتخفيف الحمل.`}));
const act=S.habits.filter(h=>!h.ar&&!FLEX((ver(h,T).freq||{}))).length;
if(cu&&cu.o>=80&&act<8)o.push({k:'add',m:ks?`أداءك قوي — أضف عادة جديدة صغيرة واربطها بـ«${ks.h.name}» (عادتك المفتاحية).`:'أداءك قوي وحملك مناسب — جاهز لإضافة عادة جديدة صغيرة.'});
if(act>=12)o.push({k:'drop',m:`عندك ${act} عادة نشطة — الحمل العالي يضعف الجودة؛ حوّل بعضها لاختيارية.`});return o.slice(0,5)}
function perfSummary(ds){const c=oaiAll(ds),pv=oaiAll(rng(addD(ds[0],-ds.length),ds.length)),k=keystone(),r=recov(),tr=trend();return JSON.stringify({الإنجاز_الشامل:c&&c.o,السابق:pv&&pv.o,الإنجاز:c&&Math.round(c.rate*100),الجودة:c&&Math.round(c.q*100),الاتساق:c&&Math.round(c.cons*100),لكل_عادة:c&&c.r.map(x=>({اسم:x.h.name,شامل:x.o,إنجاز:Math.round(x.rate*100),جودة:Math.round(x.q*100),نقاط:x.w})),عادة_مفتاحية:k&&{اسم:k.h.name,فرق:Math.round(k.df*100)},ارتباطات:corrs().map(x=>({عامل:x.n,r:+x.r.toFixed(2),أيام:x.k})),متوسط_أيام_العودة:r&&+r.avg.toFixed(1),اتجاه_8_أسابيع:tr.pts,ميل:+tr.sl.toFixed(1),توقع_الأسبوع_القادم:tr.nx})}
function perfHTML(){const P=pr(),ds=P.ds.filter(d=>d<=TE()),c=oaiAll(ds);if(!c)return '';const pv=oaiAll(rng(addD(P.ds[0],-P.ds.length),P.ds.length)),dl=pv?c.o-pv.o:null,bar=(n,v)=>`<div class="kv"><span>${n}</span><b>${Math.round(v*100)}%</b></div><div class="bar"><i style="width:${v*100}%"></i></div>`,sr=c.r.slice().sort((a,b)=>b.o-a.o);

const tr=trend(),ks=keystone(),cr=corrs(),rc=recov(),rs=recs(P);
h+=`<div class="card"><h3>📈 ${t2('محلل الأداء','Performance analyst')}</h3><div class="chart" style="height:100px">${tr.pts.map((v,i)=>`<div class="bc"><span>${v==null?'—':v}</span><i style="height:${v||0}%"></i><small>${i===7?t2('الآن','Now'):'-'+(7-i)}</small></div>`).join('')}</div>`;
if(tr.nx!=null)h+=`<div class="pf">${tr.sl>1?'📈 '+t2('اتجاهك صاعد','Trending up'):tr.sl<-1?'📉 '+t2('اتجاهك هابط','Trending down'):'➖ '+t2('أداؤك ثابت','Steady')} (${tr.sl>=0?'+':''}${tr.sl.toFixed(1)}/${t2('أسبوع','wk')}) · ${t2('المتوقع للأسبوع القادم','Next week forecast')}: <b>${tr.nx}</b></div>`;
if(ks)h+=`<div class="pf">🔑 ${t2('عادتك المفتاحية','Keystone habit')}: <b>${e(ks.h.name)}</b> — ${t2('لما تنفّذها يرتفع التزامك بباقي العادات إلى','your other habits rise to')} ${Math.round(ks.on*100)}% ${t2('مقابل','vs')} ${Math.round(ks.off*100)}%.</div>`;
cr.forEach(x=>{h+=`<div class="pf">🔗 ${e(x.n)}: ${x.r>0?t2('كل ما زاد زاد إنجازك','higher → better completion'):t2('كل ما زاد قلّ إنجازك','higher → lower completion')} (r=${x.r.toFixed(2)} · ${x.k} ${t2('يوم','days')})</div>`});

if(rs.length)h+=`<div class="mut" style="margin:10px 0 2px">${t2('توصيات: ماذا أضيف / أعدّل / أخفّف','Recommendations: add / adjust / lighten')}</div>`+rs.map(x=>`<div class="pf">${x.k==='add'?'➕':x.k==='adj'?'🛠️':'➖'} ${e(x.m)}${x.id?` <button onclick="${x.k==='adj'?`ed='${x.id}';tab='habits';render();scrollTo(0,0)`:`arch('${x.id}',1)`}">${x.k==='adj'?t2('تعديل','Edit'):t2('أرشفة','Archive')}</button>`:''}</div>`).join('');

const SYSP='أنت كبير محللي الأداء السلوكي (Behavioral Performance Analyst) بخبرة في علم العادات، القياس والتحليل الإحصائي، وتصميم السلوك (Atomic Habits، B=MAP، نوايا التنفيذ، نظرية تقرير المصير، SMART/OKR). اكتب تقرير أداء تنفيذيًا احترافيًا بالعربية المصرية المبسطة والمنظمة اعتمادًا فقط على البيانات المرفقة؛ لا تخترع أرقامًا، وصرّح بحدود البيانات لو قليلة. استخدم عناوين ## وبنودًا قصيرة بـ - . الأقسام: ## الملخص التنفيذي (سطرين + الدرجة والاتجاه) ## بطاقة الأداء (الإنجاز/الجودة/الاتساق) ## الاتجاهات والتوقع ## المحركات والارتباطات ## المخاطر ## الفرص ## ماذا أضيف ## ماذا أعدّل ## ماذا أخفّف أو أحذف ## خطة 14 يومًا (أسبوعان، خطوات محددة) ## مؤشرات المتابعة (3 KPIs بأرقام مستهدفة). كن حاسمًا، اذكر أسماء العادات، واربط كل توصية بدليل رقمي.';
window.aiPerf=()=>{const P=pr();return ai(SYSP,'الفترة: '+P.l+' ('+per+'). ملخص الأداء: '+perfSummary(P.ds)+'\nبيانات خام: '+ctx(P.ds),$('#aiX'))};

<script>
const $=s=>document.querySelector(s);
const excl=(h,d)=>(h.xs||[]).some(x=>d>=x.a&&d<=x.b);
function rtimes(r){const o=[r.t1,r.t2].filter(Boolean),v=+r.ev;if(r.t1&&v>=1){let m=+r.t1.slice(0,2)*60+ +r.t1.slice(3,5);for(m+=v*60;m<1440;m+=v*60)o.push(String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0'))}return o}
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const PR=['أساسية','مهمة','داعمة','اختيارية'],PW=[3,2,1,.5];
const LV=['لم أنفذ','أدنى','طبيعي','مثالي'];
const RS=['نسيان','كسل','إرهاق','وقت غير مناسب','المهمة كبيرة','بيئة سيئة','موبايل','نوم سيئ','طارئ','فقدان الدافع','خطة غير واقعية'];
const SUG={'نسيان':'اربطها بمحفز ثابت وضع تذكيرًا','كسل':'ابدأ بدقيقتين فقط (الحد الأدنى)','إرهاق':'انقلها لوقت طاقتك أعلى ونفّذ الأدنى','وقت غير مناسب':'جرّب وقتًا آخر لمدة أسبوع','المهمة كبيرة':'قسّمها وخفّض الطبيعي','بيئة سيئة':'جهّز المكان من الليلة السابقة','موبايل':'ضع الموبايل بعيدًا وقت التنفيذ','نوم سيئ':'ثبّت ميعاد النوم أولًا','طارئ':'نفّذ نسخة الطوارئ فقط','فقدان الدافع':'ارجع لسبب العادة ونفّذ الأدنى','خطة غير واقعية':'خفّض الهدف 30–50%'};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const wIdx=s=>(new Date(s+'T12:00').getDay()+1)%7; // السبت = 0
const wStart=s=>addD(s,-((new Date(s+"T12:00").getDay()-((((S||{}).set||{}).ws==null)?6:S.set.ws)+7)%7));
const fd=s=>new Date(s+'T12:00').toLocaleDateString((LOC[LG()]||'ar-EG'),{day:'numeric',month:'short'});
let T=iso(new Date());
const K='pdos_v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
S=S||{identity:'',habits:[
{id:'h1',name:'قراءة',why:'عقل منضبط ومعرفة أعمق',prio:1,when:'بعد صلاة العشاء',where:'المكتب',what:'أقرأ',min:'5 صفحات',std:'20 صفحة',max:'40 صفحة',em:'صفحة واحدة',fric:3,env:7,dep:'',created:T},
{id:'h2',name:'تدريب',why:'بناء مستوى احترافي',prio:0,when:'بعد العصر',where:'الملعب',what:'تدريب دفاعي',min:'10 دقائق',std:'60 دقيقة',max:'90 دقيقة',em:'10 دقائق حركة',fric:5,env:8,dep:'',created:T}],
logs:{},days:{},exps:[],rev:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){try{toast('⚠️ تعذر الحفظ: المساحة ممتلئة. احذف الصور وصدّر نسخة احتياطية الآن')}catch(y){}}};
let tab='today',date=T,wk=wStart(T),ed=null,bk='';
const H=()=>S.habits.slice().sort((a,b)=>hp(b)-hp(a)||a.prio-b.prio);
const hb=id=>S.habits.find(h=>h.id===id);
const lg=(d,id)=>(S.logs[d]||{})[id];
const st=(h,d)=>{h=ver(h,d);if(d<h.created||(h.sd&&d<h.sd)||(h.en&&d>h.en)||excl(h,d))return null;const f=h.freq||{},l0=lg(d,h.id);if(l0&&l0.l===-1)return null;const pdp=f.t==="perday"&&l0&&(l0.c||0)<(f.n||1);if(l0&&l0.l>0&&!pdp)return 1;if(f.t==="days"&&!(f.days||[]).includes(wIdx(d)))return null;if(f.t==="week"||f.t==="month")return null;const l=lg(d,h.id);if(l&&l.l>0&&!pdp)return 1;if(pdp)return d<T?0:null;if(l&&l.l===0)return 0;return d<T&&touched(d)?0:null};
function put(d,id,p){S.logs[d]=S.logs[d]||{};S.logs[d][id]=Object.assign(S.logs[d][id]||{},p);save()}
function lvl(id,l){snd(l>0?1:0);if(l>0)setTimeout(showRemain,80);const p={l};if(l>0)Object.assign(p,{q:7,d:5,e:5,qd:1},lg(date,id)&&lg(date,id).q?{q:lg(date,id).q,d:lg(date,id).d,e:lg(date,id).e,qd:lg(date,id).qd}:{});put(date,id,p);render()}
const fld=(id,k,v)=>{put(date,id,{[k]:v,qd:0})};
const dset=(k,v)=>{S.days[date]=S.days[date]||{};S.days[date][k]=v;save()};
const rset=(k,v)=>{S.rev[k]=v;save()};
function dayPct(d){let a=0,b=0;S.habits.forEach(h=>{const s=st(h,d);if(s!==null){b++;a+=s}});return b?Math.round(100*a/b):0}
function hs(h,ds){const V=ver(h,ds[ds.length-1]);if(V.freq&&(V.freq.t==="week"||V.freq.t==="month"))return hsf(V,ds);
const a=ds.map(d=>({d,s:st(h,d),l:lg(d,h.id)})).filter(x=>x.s!==null);const n=a.length;if(!n)return null;
const done=a.filter(x=>x.s===1);let runs=0,p=1;a.forEach(x=>{if(x.s===0&&p!==0)runs++;p=x.s});
const cons=(()=>{let w=0,u=0;a.forEach((x,i)=>{const k=Math.pow(.93,n-1-i);w+=k;u+=k*x.s});return w?u/w:0})(),comp=a.reduce((s,x)=>s+(x.s?Math.min(1,x.l.l/2):0),0)/n;
const av=k=>{const v=done.filter(x=>!x.l.qd&&x.l[k]!=null&&x.l[k]!=='');return v.length?v.reduce((s,x)=>s+(+x.l[k]),0)/v.length:0};
const q=av('q')/10,df=done.length?done.reduce((s,x)=>s+x.l.l,0)/done.length/3:0;
let miss=0,rec=0;a.forEach((x,i)=>{if(x.s===0){miss++;if(a[i+1]&&a[i+1].s===1)rec++}});
const r=miss?rec/miss:1,pl=['when','where','what','min','std'].filter(k=>h[k]).length/5;
return{n,rate:done.length/n,cons,r,q:av('q'),en:av('e'),done:done.length,score:Math.round(100*(.3*cons+.25*comp+.2*q+.1*df+.1*r+.05*pl))}}
function streak(h){let m=0,c=0,d=h.created;while(d<=T){const s=st(h,d);if(s===1){c++;m=Math.max(m,c)}else if(s===0)c=0;d=addD(d,1)}return m}
const rng=(a,n)=>[...Array(n)].map((_,i)=>addD(a,i));
function touched(d){const l=S.logs[d],z=S.days[d];return !!(z&&Object.keys(z).length)||!!(l&&Object.values(l).some(x=>x&&x.l!=null))}
const CONF=n=>n>=21?'عالية':n>=10?'متوسطة':'منخفضة';
function bstate(){const ds=rng(addD(T,-13),14).filter(d=>d<=T&&touched(d)&&S.habits.some(h=>st(h,d)!==null));if(ds.length<7)return{s:'⚪ بيانات غير كافية',w:`أيام مسجلة: ${ds.length} من 14 (نحتاج 7 على الأقل). الأيام غير المسجلة لا تُحتسب فشلًا.`};
const mn=a=>a.reduce((x,d)=>x+dayPct(d),0)/(a.length||1),k=Math.floor(ds.length/2),a=mn(ds.slice(0,k)),b=mn(ds.slice(k)),all=mn(ds),act=S.habits.filter(h=>h.prio<3&&!h.en).length;
const s=all>=85?'🟢 مستقر':b>a+8?'🔵 يتحسن':all>=60?'🟡 هش':act>6?'🟠 حمل زائد':'🔴 يحتاج تخفيف';
return{s,w:`المتوسط ${Math.round(all)}% · النصف الأول ${Math.round(a)}% والثاني ${Math.round(b)}% · أيام مسجلة ${ds.length}/14 · العادات النشطة ${act} · الثقة: ${CONF(ds.length*1.5)}. هذا وصف لبياناتك وليس تشخيصًا.`}}
function insights(){
const o=[],hh=S.habits;if(!hh.length)return[{m:'أضف أول عادة من تبويب العادات.'}];
const ds=rng(addD(T,-27),28);
const nT=ds.filter(d=>d<=T&&touched(d)).length,bs=bstate();o.push({g:/🟢|🔵/.test(bs.s)?1:0,m:'حالتك السلوكية: '+bs.s,w:bs.w});
if(nT<20)o.push({m:`سجّلت ${nT} من آخر 28 يومًا فقط. الأيام غير المسجلة لا تُحتسب فشلًا، لكن التحليل أقل ثقة. سجّل يوميًا ولو بالحد الأدنى.`,w:`اكتمال البيانات ${Math.round(nT/28*100)}% · الثقة: ${CONF(nT)}`});
const wr=[...Array(7)].map((_,i)=>{let a=0,b=0;ds.filter(d=>wIdx(d)===i).forEach(d=>hh.forEach(h=>{const s=st(h,d);if(s!==null){b++;a+=s}}));return b>=3?a/b:null});
const v=wr.map((x,i)=>[x,i]).filter(x=>x[0]!==null);
if(v.length>2){const lo=v.reduce((a,b)=>b[0]<a[0]?b:a),hi=v.reduce((a,b)=>b[0]>a[0]?b:a);
if(lo[0]<.6&&hi[0]-lo[0]>.2)o.push({m:`التعثر يتجمع يوم ${DAYS[lo[1]]} (${Math.round(lo[0]*100)}%) مقابل ${Math.round(hi[0]*100)}% يوم ${DAYS[hi[1]]}. خفّف الحمل أو اجعله يوم النسخة الدنيا.`,x:`تخفيف يوم ${DAYS[lo[1]]}`,w:`آخر 28 يومًا · الأضعف ${Math.round(lo[0]*100)}% والأقوى ${Math.round(hi[0]*100)}% · أيام مسجلة ${nT} · الثقة: ${CONF(nT)}. هذا ارتباط في بياناتك وليس إثباتًا للسببية.`})}
const sl=[[],[]];ds.forEach(d=>{const z=S.days[d];if(z&&z.sleep!==''&&z.sleep!=null&&hh.some(h=>st(h,d)!==null))sl[+z.sleep<6?0:1].push(dayPct(d))});
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
if(sl[0].length>1&&sl[1].length>1&&mean(sl[1])-mean(sl[0])>=15)o.push({m:`بعد نوم أقل من 6 ساعات يهبط إنجازك لـ ${Math.round(mean(sl[0]))}% مقابل ${Math.round(mean(sl[1]))}%. النوم هو العادة الأساسية.`,x:'ثبّت ميعاد نوم لمدة 7 أيام',w:`أيام نوم <6 ساعات: ${sl[0].length} · أيام ≥6: ${sl[1].length} · الثقة: ${CONF(Math.min(sl[0].length,sl[1].length)*3)}. ارتباط وليس سببية.`});
const rc={};ds.forEach(d=>hh.forEach(h=>{const l=lg(d,h.id);if(l&&l.l===0&&l.r)rc[l.r]=(rc[l.r]||0)+1}));
const tr=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
if(tr)o.push({m:`أكثر سبب للتعثر: «${tr[0]}» (${tr[1]} مرات). ${SUG[tr[0]]}.`,x:`معالجة: ${tr[0]}`,w:`تكرر هذا السبب ${tr[1]} مرة خلال 28 يومًا · الثقة: ${CONF(tr[1]*3)}`});
const sr={};ds.forEach(d=>hh.forEach(h=>{const l=lg(d,h.id);if(l&&l.l>0&&l.sr)sr[l.sr]=(sr[l.sr]||0)+1}));const ts=Object.entries(sr).sort((a,b)=>b[1]-a[1])[0];if(ts)o.push({g:1,m:`أكثر سبب لنجاحك: «${ts[0]}» (${ts[1]} مرات). كرّره عمدًا.`});
const sc=hh.map(h=>[h,hs(h,ds)]).filter(x=>x[1]);
if(sc.length){const w=sc.reduce((a,b)=>b[1].score<a[1].score?b:a),b=sc.reduce((a,c)=>c[1].score>a[1].score?c:a);
if(w[1].score<60)o.push({m:`«${w[0].name}» هي الأضعف (${w[1].score}/100). قلّل الحد الطبيعي أو انقلها لوقت أنسب.`,x:`تبسيط ${w[0].name}`,h:w[0].id});
if(b[1].score>=80)o.push({g:1,m:`«${b[0].name}» ثابتة (${b[1].score}/100). استخدمها كمرساة لعادة جديدة.`})}
hh.filter(h=>h.dep&&hb(h.dep)).forEach(h=>{const d0=hb(h.dep);let a=[0,0],b=[0,0];ds.forEach(d=>{const s=st(h,d),t=st(d0,d);if(s!==null&&t!==null){const k=t?1:0;a[k]+=s;b[k]++}});
if(a[0]/(b[0]||1)<a[1]/(b[1]||1)-.25&&b[0]>1)o.push({m:`«${h.name}» تتعثر غالبًا عندما تتعثر «${d0.name}». المشكلة قد تكون في الأصل.`})});
const ld=hh.filter(h=>h.prio<3).length;if(ld>10)o.push({m:`عندك ${ld} عادة نشطة. الزيادة قد تجعل النظام نفسه سبب الفشل؛ حوّل بعضها لاختيارية.`});
return o.length?o:[{m:'لا توجد أنماط كافية بعد. سجّل 5–7 أيام وسيظهر التحليل.'}]}
let IN=[];
function addExp(i,hid){const x=IN[i];S.exps.unshift({id:'x'+Date.now(),t:x.x,h:hid||x.h||(S.habits[0]||{}).id||'',start:T,hy:x.m,done:0});save();tab='exps';render()}
function insHTML(o){IN=o;return o.map((x,i)=>`<div class="card ins ${x.g?'good':''}"><div>${e(x.m)}</div>${x.w?`<details class="mut" style="margin-top:4px"><summary>🔍 ليه النظام قال كده؟</summary>${e(x.w)}</details>`:''}${x.x?`<button class="pri" style="margin-top:6px" onclick="addExp(${i})">ابدأ تجربة: ${e(x.x)}</button>`:''}</div>`).join('')}

<script>

h+=`<h2>درجة كل عادة (0–100)</h2>`+r.map(x=>`<div class="card p${x.b.prio}"><div class="row sp"><h3>${e(x.b.name)}</h3><b>${x.s.score}</b></div><div class="bar"><i style="width:${x.s.score}%"></i></div><div class="mut">نُفذت ${x.s.done}/${x.s.n} · سلسلة ${streak(x.b)} · عودة ${Math.round(x.s.r*100)}%</div></div>`).join('');
h+=goalsHTML(P)+`<h2>التشخيص السريع</h2>`+insHTML(insights());
h+=`<div class="card"><button class="pri" onclick="aiPer()">حلّل ${PL[per]} بالذكاء الاصطناعي مع التوصيات</button><div id="aiP" class="ai"></div></div><h2>المراجعة</h2><div class="card">${rev(P.k,['ماذا حدث؟','ماذا نجح؟','ماذا فشل ولماذا؟','ما النمط؟','ماذا نغير؟','ماذا نختبر؟'])}</div>`;
return h}
const md=t=>e(t).replace(/^#+ (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[-•*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,x=>'<ul>'+x.replace(/\n/g,'')+'</ul>').replace(/(<\/h3>|<\/ul>)\n/g,'$1').replace(/\n/g,'<br>');
function ctx(ds){ds=ds.filter(d=>d<=T);const rs={};S.habits.forEach(h=>ds.forEach(d=>{const l=lg(d,h.id);if(l&&l.l===0&&l.r){const k=h.name+': '+(l.r==='أخرى'?l.ro||l.r:l.r);rs[k]=(rs[k]||0)+1}}));
return JSON.stringify({اليوم:T,الفترة:[ds[0],ds[ds.length-1]],الهوية:S.identity,النقاط:pts(ds),أسباب_الفشل:rs,أسباب_النجاح:(()=>{const o={};S.habits.forEach(h=>ds.forEach(d=>{const l=lg(d,h.id);if(l&&l.l>0&&l.sr){const k=h.name+': '+(l.sr==='أخرى'?l.sro||l.sr:l.sr);o[k]=(o[k]||0)+1}}));return o})(),عادات:S.habits.map(h=>{const s=hs(h,ds);return{اسم:h.name,أولوية:PR[h.prio],نقاط:hp(h),لماذا:h.why,نوع:h.kind,تكرار:JSON.stringify(h.freq),أهداف:[h.gw,h.gm,h.gq,h.gy].join("/"),وصف:h.desc,محفز:[h.when,h.where,h.what].join('/'),أدنى:h.min,طبيعي:h.std,مثالي:h.max,احتكاك:h.fric,بيئة:h.env,اعتماد:(hb(h.dep)||{}).name,نتيجة:s&&{التزام:Math.round(s.rate*100),درجة:s.score,نُفذ:s.done,من:s.n,جودة:+s.q.toFixed(1),سلسلة:streak(h)}}}),تفاصيل:ds.slice(-31).map(d=>{const z=S.days[d]||{};return{d,نوم:z.sleep,طاقة:z.energy,تركيز:z.focus,مزاج:z.mood,تقييم_اليوم:z.rate,مهام:(z.tasks||[]).map(t=>t.t+(t.d?'✓':'✗')+t.p),عادات:S.habits.map(h=>h.name+':'+(lg(d,h.id)?lg(d,h.id).l:'-')).join(' ')}})})}
const SYS='أنت أكبر خبير في علم العادات وتصميم السلوك (Atomic Habits، نموذج فوج B=MAP، نوايا التنفيذ، نظرية تقرير المصير). حلّل بيانات المستخدم بدقة وبالعربية المصرية المبسطة والمنظمة. لا تخترع بيانات؛ لو البيانات قليلة قل ذلك صراحة. التنسيق: عناوين ## ثم نقاط قصيرة تبدأ بـ - . الأقسام بالترتيب: ## الخلاصة ## نقاط القوة ## المشاكل وأسبابها ## ماذا أضيف ## ماذا أعدّل ## ماذا أخفّف أو أحذف ## خطة الفترة القادمة (خطوات محددة) ## تجربة مقترحة. كن محددًا وعمليًا واذكر أسماء العادات واربط التوصيات بالنقاط والأولويات.';
const SYSC='أنت مدرب شخصي أعلى خبير في العادات والسلوك والانضباط. ردّ بالعربية المصرية المبسطة، مباشرًا وعمليًا ومختصرًا، ومبنيًا على بيانات المستخدم المرفقة. لا تخترع بيانات. اقترح خطوات صغيرة قابلة للتنفيذ، وسؤالًا واحدًا فقط عند الحاجة.';
async function ai(sys,u,box){box.innerHTML='<div class="mut">جارٍ التحليل…</div>';try{const sm=await claude.use('sample');if(!sm){const t0=LC(u);box.innerHTML=md(t0);return t0}

const aiDay=()=>ai(SYS,'نوع التحليل: يومي ليوم '+date+' مع مقارنته بآخر 7 أيام. البيانات: '+ctx(rng(addD(date,-6),7)),$('#aiD'));

function vCoach(){return `<h2>مدرب العادات الذكي</h2><div class="mut">اسأل عن أي عادة أو مشكلة أو خطة. يرى بياناتك آخر 30 يومًا.</div><div class="row" style="margin:8px 0">${['ليه بتعثر؟','إيه أضيف وإيه أعدّل؟','اعمل لي خطة الأسبوع الجاي','ازاي أبني عادة جديدة؟'].map(q=>`<button class="tag" onclick="ask('${q}')">${q}</button>`).join('')}</div><div id="cl">${S.chat.map(m=>`<div class="msg ${m.r}">${m.r==='u'?e(m.c):md(m.c)}</div>`).join('')}</div><textarea id="cq" placeholder="اكتب سؤالك…"></textarea><div class="row" style="margin-top:6px"><button class="pri" onclick="ask()">إرسال</button><button onclick="S.chat=[];save();render()">مسح المحادثة</button></div>`}
async function ask(q){q=q||$('#cq').value.trim();if(!q)return;S.chat.push({r:'u',c:q});render();const box=document.createElement('div');box.className='msg a';$('#cl').appendChild(box);const hist=S.chat.slice(-9,-1).map(m=>(m.r==='u'?'المستخدم: ':'المدرب: ')+m.c).join('\n');
const t=await ai(SYSC,'بيانات المستخدم (آخر 30 يومًا): '+ctx(rng(addD(T,-29),30))+'\nالمحادثة السابقة:\n'+hist+'\nسؤال المستخدم الحالي: '+q,box);if(t){S.chat.push({r:'a',c:t});S.chat=S.chat.slice(-30);save()}}

const IC=[['🏋️','تدريب'],['⚽','كرة'],['🏃','جري'],['🚴','دراجة'],['🏊','سباحة'],['🥊','قتال'],['🕌','صلاة'],['📿','ذكر'],['🤲','دعاء'],['🕋','قرآن'],['📖','قراءة'],['📚','دراسة'],['💻','برمجة'],['🧠','تعلّم'],['✍️','كتابة'],['🗣️','لغة'],['💧','ماء'],['🥗','أكل صحي'],['😴','نوم'],['🧘','تأمل'],['📵','موبايل'],['🚭','تدخين'],['🍬','سكر'],['💰','ادخار'],['📈','استثمار'],['🎯','هدف'],['🎨','فن'],['🎸','موسيقى'],['🧹','تنظيف'],['🛏️','ترتيب'],['👨‍👩‍👧','أسرة'],['🤝','علاقات'],['💼','عمل'],['📞','تواصل'],['🌅','صباح'],['💊','دواء'],['🛁','عناية'],['🌳','طبيعة']];
const FM=[['name','اسم العادة / المهمة'],['desc','الوصف'],['why','السبب (لماذا؟)'],['when','متى / المحفز'],['where','أين'],['what','ماذا أفعل'],['min','الحد الأدنى'],['std','الطبيعي'],['max','المثالي'],['em','نسخة الطوارئ']];
function ver(h,d){let r=h;(h.vs||[]).forEach(v=>{if(v.from<=d)r=Object.assign({},r,v)});return r}
const FL=f=>({daily:'يوميًا',days:'أيام: '+(f.days||[]).map(i=>DAYS[i]).join('، '),week:f.n+' مرات/أسبوع',month:f.n+' مرات/شهر',perday:f.n+' مرات/يوم'+(f.h?' كل '+f.h+' ساعة':'')}[f.t||'daily']);
const cnt=(h,ds)=>ds.filter(d=>d<=T&&(lg(d,h.id)||{}).l>0).length;
const mr=d=>{const x=new Date(d+'T12:00'),a=new Date(x.getFullYear(),x.getMonth(),1);return rng(iso(a),new Date(x.getFullYear(),x.getMonth()+1,0).getDate())};
function hsf(h,ds){const f=h.freq,dd=ds.filter(d=>d<=T&&d>=h.created);if(!dd.length)return null;const L=dd.map(d=>lg(d,h.id)).filter(l=>l&&l.l>0),n=Math.max(1,Math.round(f.n*dd.length/(f.t==='week'?7:30.4))),done=L.length,rate=Math.min(1,done/n),av=k=>done?L.reduce((s,l)=>s+(+l[k]||0),0)/done:0;
return{n,rate,cons:rate,r:1,q:av('q'),en:av('e'),done,score:Math.round(100*(.55*rate+.25*av('q')/10+.2*(done?L.reduce((s,l)=>s+l.l,0)/done/3:0)))}}

<script>
/* حماية البيانات: نسخة مرآة في IndexedDB + طلب تخزين دائم + اختبار حسابات */
(function(){const O=()=>new Promise((ok,no)=>{const r=indexedDB.open('pdos_idb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>ok(r.result);r.onerror=()=>no()});
const put_=async v=>{try{const d=await O();d.transaction('s','readwrite').objectStore('s').put(v,K)}catch(x){}};
const get_=async()=>{try{const d=await O();return await new Promise(ok=>{const r=d.transaction('s').objectStore('s').get(K);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(x){return null}};
let last='';const flush=()=>{try{const j=JSON.stringify(S);if(j!==last){last=j;put_(j)}}catch(x){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
get_().then(j=>{try{if(j&&!localStorage.getItem(K)){localStorage.setItem(K,j);location.reload();return}}catch(x){}last=j||'';flush()});
setInterval(flush,15000);addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()})})();

<script>
/* مدرب وقت أذكى + محلل يوم أعمق + أفضل/أسوأ فترة + بصمة الوقت */
(function(){

if(x==null){const rm=Object.values(h).find(v=>v&&typeof v==='object'&&typeof v.t1==='string');x=zhrm(rm&&rm.t1);
if(x==null){const w=String(h.when||''),k=[['فجر',5],['صباح',9],['ظهر',13],['عصر',16],['مغرب',18],['عشاء',20],['مساء',20],['ليل',23],['نوم',23]].find(a=>w.includes(a[0]));x=k?k[1]:null}}
if(x==null)return null;if(x<4)x+=24;return{i:zTE.findIndex((a,i)=>x>=a&&x<zTE[i+1]),src}}
function ztimeStats(){const ds=rng(addD(T,-55),56).filter(d=>d<=T&&touched(d)),B=zTB.map(()=>({n:0,ok:0,a:0,rs:{},nm:{},oe:[],ke:[],os:[],ks:[]}));
ds.forEach(d=>{const z=S.days[d]||{},e_=zn(z.energy),sl=zn(z.sleep);S.habits.forEach(h=>{const s=st(h,d);if(s===null)return;const l=lg(d,h.id),b=zbkt(h,l);if(!b)return;const o=B[b.i];o.n++;o.a+=b.src;
if(s){o.ok++;if(e_!=null)o.oe.push(e_);if(sl!=null)o.os.push(sl)}else{if(l&&l.r)o.rs[l.r]=(o.rs[l.r]||0)+1;o.nm[h.name]=(o.nm[h.name]||0)+1;if(e_!=null)o.ke.push(e_);if(sl!=null)o.ks.push(sl)}})});
const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];

function ztimeLines(){const t=ztimeStats().filter(x=>x.n>=6);if(t.length<2)return['- بيانات الوقت غير كافية بعد (نحتاج 6 تسجيلات على الأقل في كل فترة). حدّد وقت التذكير أو حقل «متى» لكل عادة، وسجّل لحظة التنفيذ.'];
const hi=t.reduce((a,b)=>b.pct>a.pct?b:a),lo=t.reduce((a,b)=>b.pct<a.pct?b:a),o=[`- أكثر وقت تنجز فيه: ${hi.name} (${hi.pct}% من ${hi.n}) · الثقة ${CONF(hi.n)}`];
if(lo!==hi){const w=[];if(lo.reason)w.push(`أكثر سبب مسجّل «${lo.reason[0]}» (${lo.reason[1]} مرات)`);if(lo.habit)w.push(`أكثر عادة تتعثر فيه «${lo.habit[0]}»`);
if(lo.en[0]!=null&&lo.en[1]!=null&&lo.en[0]-lo.en[1]>=1)w.push(`طاقتك في أيام التعثر ${lo.en[1].toFixed(1)} مقابل ${lo.en[0].toFixed(1)} في أيام النجاح`);
if(lo.sl[0]!=null&&lo.sl[1]!=null&&lo.sl[0]-lo.sl[1]>=.7)w.push(`نومك أقل (${lo.sl[1].toFixed(1)} س مقابل ${lo.sl[0].toFixed(1)})`);
o.push(`- أكثر وقت تفشل فيه: ${lo.name} (${lo.pct}% نجاح فقط من ${lo.n}) · الثقة ${CONF(lo.n)}`,`- ليه؟ ${w.length?w.join(' · '):'لا يوجد سبب مسجّل كافٍ؛ سجّل سبب التعثر لتظهر الإجابة'}. هذا ارتباط وليس إثباتًا للسببية.`)}
const N=t.reduce((s,x)=>s+x.n,0);o.push(`- مصدر الوقت: ${Math.round(t.reduce((s,x)=>s+x.actual*x.n,0)/N)}% من التسجيلات بوقت تنفيذ فعلي، والباقي مقدّر من موعد العادة. التسجيلات الجديدة تحفظ وقتها تلقائيًا.`);return o}
function zwhy(ds){const rs={};ds.forEach(d=>S.habits.forEach(h=>{const l=lg(d,h.id);if(l&&l.l===0&&l.r)rs[l.r]=(rs[l.r]||0)+1}));
const r=Object.entries(rs).sort((a,b)=>b[1]-a[1])[0],sl=zavg(ds.map(d=>zn((S.days[d]||{}).sleep)).filter(x=>x>0)),en=zavg(ds.map(d=>zn((S.days[d]||{}).energy)).filter(x=>x>0));
return[r?`أكثر تعثر: ${r[0]} (${r[1]})`:'',sl?`النوم ${sl.toFixed(1)} س`:'',en?`الطاقة ${en.toFixed(1)}/10`:''].filter(Boolean).join(' · ')||'لا توجد تفاصيل مسجلة'}
function zbw(){const P=rng(addD(T,-364),365).filter(d=>d<=T&&touched(d)&&S.habits.some(h=>st(h,d)!==null)).map(d=>({d,p:dayPct(d)}));
const ex=(a,min)=>{a=a.filter(x=>x.n>=min);return a.length<2?null:[a.reduce((x,y)=>y.p>=x.p?y:x),a.reduce((x,y)=>y.p<=x.p?y:x)]};
const grp=f=>{const m={};P.forEach(x=>(m[f(x.d)]=m[f(x.d)]||[]).push(x));return Object.entries(m).map(([k,v])=>({k,ds:v.map(x=>x.d),p:Math.round(v.reduce((s,x)=>s+x.p,0)/v.length),n:v.length}))};

const ZSD='أنت مدرب تنظيم وقت وسلوك على مستوى عالمي (Deep Work، Time Blocking، مصفوفة أيزنهاور، المهمة الأهم MIT، قانون باريتو، قانون باركنسون، دورات الطاقة 90 دقيقة، النمط الزمني الشخصي، نوايا التنفيذ، قاعدة الدقيقتين). حلّل يوم المستخدم بالعربية المصرية المبسطة. القواعد: اعتمد على الأرقام المرفقة فقط ولا تخترع بيانات؛ فرّق صراحةً بين حقيقة مسجّلة وفرضية؛ الارتباط ليس سببية؛ اذكر عدد الأيام ومستوى الثقة؛ الأيام غير المسجلة ليست فشلًا؛ لو البيانات قليلة قل ذلك. التنسيق ## ثم نقاط قصيرة: ## قراءة اليوم (الرقم + حكم في سطر) ## أفضل لحظة وأسوأ لحظة ولماذا ## مقارنة بآخر 7 أيام ## ما الذي أثّر (نوم/طاقة/وقت/حمل) ## قرار واحد لبكرة ## جدول مقترح لبكرة بساعات محددة يتوافق مع فترات نجاحه وطاقته، فيه أهم مهمة واحدة وبلوك تعافي ## تجربة صغيرة 7 أيام بمقياس نجاح. اختم بسؤال واحد فقط.';
const ZSC='أنت مدرب تنظيم وقت وانضباط على مستوى عالمي، تتحدث بالعربية المصرية المبسطة، مباشر وعملي وأقل من 12 سطرًا. استخدم بيانات المستخدم وبصمة الوقت المرفقة فقط ولا تخترع. فرّق بين الحقيقة والفرضية، واذكر الثقة وعدد الأيام، والارتباط ليس سببية. لو سُئل عن أفضل وقت أو سبب الفشل فاعتمد على بصمة الوقت. لو طلب جدولًا فأعطه جدولًا بساعات محددة حسب طاقته ومواعيد عاداته مع مهمة أولى واحدة وبلوك راحة ووقت احتياطي. لو كان مثقلًا فاقترح ما يُؤجَّل أو يُختصر بمنطق أيزنهاور وباريتو. اختم بخطوة واحدة تنفّذها خلال 24 ساعة.';

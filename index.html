const pend=d=>S.habits.filter(h=>{const v=ver(h,d),f=v.freq||{},l=lg(d,h.id)||{};return !h.ar&&d>=h.created&&inWin(v,d)&&f.t!=='week'&&f.t!=='month'&&(f.t!=='days'||(f.days||[]).includes(wIdx(d)))&&!(l.l>0)&&l.l!==-1&&!(typeof excl==='function'&&excl(h,d))});
const rows=(h,d0,n)=>{const o=[];for(let i=1;i<=n;i++){const d=addD(d0,-i),s=st(h,d);if(s!==null)o.push({d,s,i})}return o};
function prob(h,d0){const r=rows(h,d0,56);if(r.length<5)return null;let w=0,u=0;r.forEach(x=>{const k=Math.pow(.97,x.i);w+=k;u+=k*x.s});let p=(u+1)/(w+2);
const wd=r.filter(x=>wIdx(x.d)===wIdx(d0));if(wd.length>=3)p=.6*p+.4*((wd.reduce((a,x)=>a+x.s,0)+1)/(wd.length+2));
const sl=+((S.days[d0]||{}).sleep);if(sl>0){const g=[[],[]];r.forEach(x=>{const z=+((S.days[x.d]||{}).sleep);if(z>0)g[z<6?0:1].push(x.s)});const m=g[sl<6?0:1];if(m.length>=4)p=.6*p+.4*m.reduce((a,b)=>a+b,0)/m.length}
return Math.max(.02,Math.min(.98,p))}
function strength(h){if(window.HM&&window.HM.sU)return window.HM.sU(h);let s=0,d=h.created>addD(T,-400)?h.created:addD(T,-400);for(;d<T;d=addD(d,1)){const v=st(h,d);if(v!==null)s=s*.94+.06*v}return Math.round(s*100)}
const lab=s=>s<25?t('ضعيفة','Weak'):s<50?t('تتكوّن','Forming'):s<75?t('قوية','Strong'):t('راسخة','Solid');
})();

<script>
(function(){
const t2=(a,b)=>LG()==='en'?b:a;
/* ---- 20 أيقونة جديدة للبناء والترك ---- */
const NI=[['🍔','ترك الوجبات السريعة'],['🥤','ترك المشروبات الغازية'],['☕','تقليل الكافيين'],['🎮','تقليل الألعاب'],['📺','تقليل التلفاز'],['🛒','ترك التسوق الاندفاعي'],['🎰','ترك المقامرة'],['😡','ضبط الغضب'],['🤬','ترك الشتائم'],['💅','ترك قضم الأظافر'],['⏰','استيقاظ مبكر'],['🚶','مشي'],['🦷','تنظيف الأسنان'],['🧼','نظافة'],['🍎','أكل فاكهة'],['🎧','بودكاست'],['🙏','امتنان'],['📝','يوميات'],['🧑‍🍳','طبخ صحي'],['🌙','قيام الليل'],['🛑','إيقاف عادة سيئة'],['💬','تقليل السوشيال ميديا'],['🥦','خضروات'],['🧗','تحدّي']];
IC.unshift(...NI.filter(x=>!IC.some(y=>y[0]===x[0])).slice(0,20));
/* ---- الإنجاز الشامل ---- */
const FLEX=f=>f&&(f.t==='week'||f.t==='month');
function oaiH(h0,ds){const V=ver(h0,ds[ds.length-1]||T),f=V.freq||{};
if(FLEX(f)){const s=hs(h0,ds);if(!s)return null;const q=s.q?s.q/10:.7;return{h:V,rate:s.rate,q,cons:s.cons||s.rate,o:Math.round(100*(.6*s.rate+.4*q)),w:hp(V)}}
let n=0,dn=0,lf=0,qs=[];ds.forEach(d=>{if(d>TE())return;const s=st(h0,d);if(s===null)return;n++;if(s===1){dn++;const l=lg(d,h0.id)||{};lf+=Math.min(1,(l.l>0?l.l:1)/2);if(l.q!=null&&!l.qd&&+l.q>0)qs.push(+l.q)}});
if(!n)return null;const rate=dn/n,q=qs.length?qs.reduce((a,b)=>a+b,0)/qs.length/10:(dn?lf/dn:0),s=hs(h0,ds);return{h:V,rate,q,cons:s&&s.cons!=null?s.cons:rate,o:Math.round(100*(.6*rate+.4*q)),w:hp(V)}}
function oaiAll(ds){ds=ds.filter(d=>d<=TE());const r=S.habits.filter(h=>!h.ar).map(h=>oaiH(h,ds)).filter(Boolean);if(!r.length)return null;const W=r.reduce((a,x)=>a+x.w,0),f=k=>r.reduce((a,x)=>a+x.w*x[k],0)/W;return{o:Math.round(f('o')),rate:f('rate'),q:f('q'),cons:f('cons'),r}}
const grade=o=>o>=90?t2('استثنائي 🏆','Exceptional 🏆'):o>=80?t2('ممتاز 🌟','Excellent 🌟'):o>=65?t2('جيد جدًا 👏','Very good 👏'):o>=50?t2('جيد 👍','Good 👍'):o>=35?t2('يحتاج تحسين 💪','Needs work 💪'):t2('ابدأ من الأساسيات 🌱','Start with basics 🌱');
/* ---- محلل الأداء ---- */
const pear=(x,y)=>{const n=x.length,mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n;let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):0};
function corrs(){const ds=rng(addD(T,-59),60).filter(d=>d<=TE()),o=[];[['النوم',z=>+z.sleep],['الطاقة',z=>+z.energy],['التركيز',z=>+z.focus],['المزاج',z=>+z.mood]].forEach(([n,f])=>{const X=[],Y=[];ds.forEach(d=>{const z=S.days[d],v=z?f(z):NaN,p=bp([d]);if(v>0&&p!=null){X.push(v);Y.push(p)}});if(X.length>=8)o.push({n,r:pear(X,Y),k:X.length})});
const X=[],Y=[];ds.forEach(d=>{const m=(S.focus||{})[d],p=bp([d]);if(m>0&&p!=null){X.push(m);Y.push(p)}});if(X.length>=6)o.push({n:'وقت التركيز (بومودورو)',r:pear(X,Y),k:X.length});return o.filter(x=>Math.abs(x.r)>=.3).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r)).slice(0,3)}
function keystone(){const hh=S.habits.filter(h=>!h.ar);if(hh.length<3)return null;const ds=rng(addD(T,-59),60).filter(d=>d<T);let best=null;hh.forEach(a=>{const on=[],off=[];ds.forEach(d=>{const sa=st(a,d);if(sa===null)return;const o=hh.filter(b=>b!==a).map(b=>st(b,d)).filter(x=>x!==null);if(!o.length)return;(sa?on:off).push(o.reduce((x,y)=>x+y,0)/o.length)});if(on.length>=6&&off.length>=6){const m=x=>x.reduce((p,q)=>p+q,0)/x.length,df=m(on)-m(off);if(!best||df>best.df)best={h:ver(a,T),df,on:m(on),off:m(off)}}});return best&&best.df>=.15?best:null}
function recov(){const L=[];S.habits.filter(h=>!h.ar).forEach(h=>{let m=0;rng(addD(T,-89),90).forEach(d=>{if(d>TE())return;const s=st(h,d);if(s===0)m++;else if(s===1&&m>0){L.push(m);m=0}})});return L.length?{avg:L.reduce((a,b)=>a+b,0)/L.length,n:L.length}:null}
function trend(){const pts_=[];for(let i=7;i>=0;i--){const w=rng(addD(wStart(T),-7*i),7).filter(d=>d<=TE()),r=w.length?oaiAll(w):null;pts_.push(r?r.o:null)}const P=pts_.map((y,x)=>[x,y]).filter(p=>p[1]!=null);let sl=0,nx=null;if(P.length>=3){const n=P.length,mx=P.reduce((a,p)=>a+p[0],0)/n,my=P.reduce((a,p)=>a+p[1],0)/n;let a=0,b=0;P.forEach(p=>{a+=(p[0]-mx)*(p[1]-my);b+=(p[0]-mx)**2});sl=b?a/b:0;nx=Math.max(0,Math.min(100,Math.round(P[P.length-1][1]+sl)))}return{pts:pts_,sl,nx}}
function recs(P){const ds=P.ds.filter(d=>d<=TE()),a=S.habits.filter(h=>!h.ar).map(h=>oaiH(h,ds)).filter(Boolean),o=[],ks=keystone(),cu=oaiAll(ds);
a.forEach(x=>{if(x.rate<.5)o.push({k:'adj',id:x.h.id,m:`«${x.h.name}»: الالتزام ${Math.round(x.rate*100)}% — خفّض الطبيعي أو اربطها بمحفز أوضح.`});else if(x.rate>=.85&&x.q<.6)o.push({k:'adj',id:x.h.id,m:`«${x.h.name}»: تنفّذها بانتظام لكن الجودة ${Math.round(x.q*100)}% — ركّز على الجودة أو ارفع التحدي.`})});
a.filter(x=>x.rate<.3&&hp(x.h)<=5).slice(0,1).forEach(x=>o.push({k:'drop',id:x.h.id,m:`«${x.h.name}»: التزام ${Math.round(x.rate*100)}% ونقاط قليلة — فكّر في أرشفتها مؤقتًا لتخفيف الحمل.`}));
const act=S.habits.filter(h=>!h.ar&&!FLEX((ver(h,T).freq||{}))).length;
if(cu&&cu.o>=80&&act<8)o.push({k:'add',m:ks?`أداءك قوي — أضف عادة جديدة صغيرة واربطها بـ«${ks.h.name}» (عادتك المفتاحية).`:'أداءك قوي وحملك مناسب — جاهز لإضافة عادة جديدة صغيرة.'});
if(act>=12)o.push({k:'drop',m:`عندك ${act} عادة نشطة — الحمل العالي يضعف الجودة؛ حوّل بعضها لاختيارية.`});return o.slice(0,5)}
function perfSummary(ds){const c=oaiAll(ds),pv=oaiAll(rng(addD(ds[0],-ds.length),ds.length)),k=keystone(),r=recov(),tr=trend();return JSON.stringify({الإنجاز_الشامل:c&&c.o,السابق:pv&&pv.o,الإنجاز:c&&Math.round(c.rate*100),الجودة:c&&Math.round(c.q*100),الاتساق:c&&Math.round(c.cons*100),لكل_عادة:c&&c.r.map(x=>({اسم:x.h.name,شامل:x.o,إنجاز:Math.round(x.rate*100),جودة:Math.round(x.q*100),نقاط:x.w})),عادة_مفتاحية:k&&{اسم:k.h.name,فرق:Math.round(k.df*100)},ارتباطات:corrs().map(x=>({عامل:x.n,r:+x.r.toFixed(2),أيام:x.k})),متوسط_أيام_العودة:r&&+r.avg.toFixed(1),اتجاه_8_أسابيع:tr.pts,ميل:+tr.sl.toFixed(1),توقع_الأسبوع_القادم:tr.nx})}
function perfHTML(){const P=pr(),ds=P.ds.filter(d=>d<=TE()),c=oaiAll(ds);if(!c)return '';const pv=oaiAll(rng(addD(P.ds[0],-P.ds.length),P.ds.length)),dl=pv?c.o-pv.o:null,bar=(n,v)=>`<div class="kv"><span>${n}</span><b>${Math.round(v*100)}%</b></div><div class="bar"><i style="width:${v*100}%"></i></div>`,sr=c.r.slice().sort((a,b)=>b.o-a.o);
let h=`<div class="card oai-card"><div class="row" style="flex-wrap:nowrap;gap:14px"><div class="oai-ring" style="background:conic-gradient(var(--a1) ${c.o*3.6}deg,var(--ln) 0)"><span>${c.o}</span></div><div style="flex:1"><h3>🏅 ${t2('الإنجاز الشامل','Overall performance')}</h3><div>${grade(c.o)}</div>${dl==null?'':`<div class="${dl>=0?'up':'dw'}"><b>${dl>=0?'▲ +':'▼ '}${dl}</b> <span class="mut">${t2('عن الفترة السابقة','vs previous period')}</span></div>`}</div></div><div style="margin-top:10px">${bar(t2('الإنجاز (نسبة التنفيذ)','Completion'),c.rate)}${bar(t2('الجودة','Quality'),c.q)}${bar(t2('الاتساق','Consistency'),c.cons)}</div><div class="mut" style="margin-top:6px;font-size:.74rem">${t2('الإنجاز الشامل = 60% إنجاز + 40% جودة، موزونة بنقاط كل عادة.','Overall = 60% completion + 40% quality, weighted by habit points.')}</div>${sr.length>1?`<div class="mut" style="margin:10px 0 2px">${t2('ترتيب العادات','Habits ranked')}</div>`+sr.map(x=>`<div class="kv"><span>${x.h.ic||'🎯'} ${e(x.h.name)}</span><b>${x.o}</b></div>`).join(''):''}</div>`;
const tr=trend(),ks=keystone(),cr=corrs(),rc=recov(),rs=recs(P);
h+=`<div class="card"><h3>📈 ${t2('محلل الأداء','Performance analyst')}</h3><div class="chart" style="height:100px">${tr.pts.map((v,i)=>`<div class="bc"><span>${v==null?'—':v}</span><i style="height:${v||0}%"></i><small>${i===7?t2('الآن','Now'):'-'+(7-i)}</small></div>`).join('')}</div>`;
if(tr.nx!=null)h+=`<div class="pf">${tr.sl>1?'📈 '+t2('اتجاهك صاعد','Trending up'):tr.sl<-1?'📉 '+t2('اتجاهك هابط','Trending down'):'➖ '+t2('أداؤك ثابت','Steady')} (${tr.sl>=0?'+':''}${tr.sl.toFixed(1)}/${t2('أسبوع','wk')}) · ${t2('المتوقع للأسبوع القادم','Next week forecast')}: <b>${tr.nx}</b></div>`;
if(ks)h+=`<div class="pf">🔑 ${t2('عادتك المفتاحية','Keystone habit')}: <b>${e(ks.h.name)}</b> — ${t2('لما تنفّذها يرتفع التزامك بباقي العادات إلى','your other habits rise to')} ${Math.round(ks.on*100)}% ${t2('مقابل','vs')} ${Math.round(ks.off*100)}%.</div>`;
cr.forEach(x=>{h+=`<div class="pf">🔗 ${e(x.n)}: ${x.r>0?t2('كل ما زاد زاد إنجازك','higher → better completion'):t2('كل ما زاد قلّ إنجازك','higher → lower completion')} (r=${x.r.toFixed(2)} · ${x.k} ${t2('يوم','days')})</div>`});
if(rc)h+=`<div class="pf">🔄 ${t2('متوسط العودة بعد التعثر','Avg. return after a slip')}: <b>${rc.avg.toFixed(1)}</b> ${t2('يوم','days')}</div>`;
if(rs.length)h+=`<div class="mut" style="margin:10px 0 2px">${t2('توصيات: ماذا أضيف / أعدّل / أخفّف','Recommendations: add / adjust / lighten')}</div>`+rs.map(x=>`<div class="pf">${x.k==='add'?'➕':x.k==='adj'?'🛠️':'➖'} ${e(x.m)}${x.id?` <button onclick="${x.k==='adj'?`ed='${x.id}';tab='habits';render();scrollTo(0,0)`:`arch('${x.id}',1)`}">${x.k==='adj'?t2('تعديل','Edit'):t2('أرشفة','Archive')}</button>`:''}</div>`).join('');
return h+`<button class="pri" style="margin-top:10px;width:100%" onclick="aiPerf()">🧠 ${t2('تقرير أداء عميق بالذكاء الاصطناعي','Deep AI performance report')}</button><div id="aiX" class="ai"></div></div>`}
const SYSP='أنت كبير محللي الأداء السلوكي (Behavioral Performance Analyst) بخبرة في علم العادات، القياس والتحليل الإحصائي، وتصميم السلوك (Atomic Habits، B=MAP، نوايا التنفيذ، نظرية تقرير المصير، SMART/OKR). اكتب تقرير أداء تنفيذيًا احترافيًا بالعربية المصرية المبسطة والمنظمة اعتمادًا فقط على البيانات المرفقة؛ لا تخترع أرقامًا، وصرّح بحدود البيانات لو قليلة. استخدم عناوين ## وبنودًا قصيرة بـ - . الأقسام: ## الملخص التنفيذي (سطرين + الدرجة والاتجاه) ## بطاقة الأداء (الإنجاز/الجودة/الاتساق) ## الاتجاهات والتوقع ## المحركات والارتباطات ## المخاطر ## الفرص ## ماذا أضيف ## ماذا أعدّل ## ماذا أخفّف أو أحذف ## خطة 14 يومًا (أسبوعان، خطوات محددة) ## مؤشرات المتابعة (3 KPIs بأرقام مستهدفة). كن حاسمًا، اذكر أسماء العادات، واربط كل توصية بدليل رقمي.';
window.aiPerf=()=>{const P=pr();return ai(SYSP,'الفترة: '+P.l+' ('+per+'). ملخص الأداء: '+perfSummary(P.ds)+'\nبيانات خام: '+ctx(P.ds),$('#aiX'))};
